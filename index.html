<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edu Pulse: higher education news, India first</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f4f7;
    --panel: #ffffff;
    --ink: #17203a;
    --muted: #5d6680;
    --line: #dde2ea;
    --accent: #1f3fbf;
    --accent-soft: #e5eafb;
    --saffron: #d98a0b;
    --focus: #1f3fbf;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root:not([data-theme="light"]) {
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1424; --panel: #171e34; --ink: #e8ebf5; --muted: #98a1bd;
      --line: #28324e; --accent: #8ea4ff; --accent-soft: #212c52; --saffron: #f0b04a; --focus: #8ea4ff;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.5;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .shell { max-width: 1180px; margin: 0 auto; padding: 0 20px 64px; }

  header.top { padding: 28px 0 18px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; }
  h1 { font-family: var(--serif); font-weight: 650; font-size: clamp(1.9rem, 4vw, 2.6rem); letter-spacing: -0.01em; margin: 0; line-height: 1.1; }
  .tagline { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
  .updated { color: var(--muted); font-size: 0.85rem; text-align: right; }
  .updated strong { color: var(--ink); font-weight: 600; }

  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 0 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .search { flex: 1 1 240px; position: relative; }
  .search input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 0.95rem;
  }
  select {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit; font-size: 0.95rem; max-width: 100%;
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.9rem; font-weight: 500;
    padding: 10px 14px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0f1424; } }

  .layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; margin-top: 22px; align-items: start; }

  nav.topics { position: sticky; top: 76px; }
  nav.topics h2 { font-family: var(--serif); font-size: 1.05rem; margin: 0 0 8px; font-weight: 650; }
  nav.topics ul { list-style: none; margin: 0; padding: 0; }
  nav.topics button {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    text-align: left; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 0.95rem; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    border-left: 4px solid transparent;
  }
  nav.topics button:hover { background: var(--accent-soft); }
  nav.topics button[aria-pressed="true"] { background: var(--accent-soft); font-weight: 600; border-left-color: var(--accent); }
  nav.topics .count { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }

  .day { font-family: var(--serif); font-size: 1.05rem; font-weight: 650; margin: 26px 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
  .day:first-child { margin-top: 0; }

  article.item { padding: 16px 0; border-bottom: 1px solid var(--line); }
  article.item h3 { margin: 0 0 6px; font-size: 1.12rem; line-height: 1.35; font-weight: 600; }
  article.item h3 a { text-decoration: none; }
  article.item h3 a:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  article.item p { margin: 0 0 8px; color: var(--muted); font-size: 0.95rem; max-width: 70ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.85rem; color: var(--muted); }
  .meta .src { color: var(--ink); font-weight: 600; }
  .badge-in { color: var(--saffron); font-weight: 600; }
  .tags { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 1px 9px; border-radius: 999px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }

  .status { padding: 40px 0; color: var(--muted); max-width: 52ch; }
  .status strong { color: var(--ink); display: block; font-family: var(--serif); font-size: 1.2rem; margin-bottom: 6px; }
  button.more { margin: 22px 0 0; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
  button.more:hover { background: var(--accent-soft); }
  .result-line { color: var(--muted); font-size: 0.88rem; margin: 0 0 14px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; gap: 14px; }
    nav.topics { position: static; }
    nav.topics ul { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    nav.topics li { flex: 0 0 auto; }
    nav.topics button { width: auto; border: 1px solid var(--line); border-left-width: 1px; background: var(--panel); border-radius: 999px; white-space: nowrap; }
    nav.topics button[aria-pressed="true"] { border-color: var(--accent); }
    nav.topics h2 { display: none; }
    .updated { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Edu Pulse</h1>
      <p class="tagline">Higher education news from India and around the world, sorted by topic.</p>
    </div>
    <div class="updated" id="updated"></div>
  </header>

  <div class="controls">
    <div class="search"><input id="q" type="search" placeholder="Search headlines" aria-label="Search headlines"></div>
    <div class="seg" role="group" aria-label="Region">
      <button data-region="All" aria-pressed="true">All</button>
      <button data-region="India" aria-pressed="false">India</button>
      <button data-region="Global" aria-pressed="false">Global</button>
    </div>
    <select id="source" aria-label="Filter by source"><option value="">All sources</option></select>
    <select id="range" aria-label="Time range">
      <option value="1">Last 24 hours</option>
      <option value="3">Last 3 days</option>
      <option value="7" selected>Last 7 days</option>
      <option value="30">Last 30 days</option>
    </select>
  </div>

  <div class="layout">
    <nav class="topics" aria-label="Topics">
      <h2>Topics</h2>
      <ul id="topics"></ul>
    </nav>
    <main>
      <div id="results"><div class="status"><strong>Loading the latest news</strong>This takes a moment.</div></div>
    </main>
  </div>
</div>

<script>
(function () {
  var state = { topic: "All", region: "All", source: "", days: 7, q: "", shown: 40 };
  var data = null;
  var PAGE = 40;

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  function relTime(iso) {
    var mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (mins < 60) return Math.max(mins, 1) + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + " hr ago";
    var d = Math.round(hrs / 24);
    return d + (d === 1 ? " day ago" : " days ago");
  }
  function dayLabel(iso) {
    var d = new Date(iso), t = new Date();
    var a = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var b = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
    var diff = Math.round((b - a) / 86400000);
    if (diff <= 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long" });
  }

  function inRange(item) {
    return (Date.now() - new Date(item.published).getTime()) <= state.days * 86400000;
  }
  function matchesExceptTopic(item) {
    if (!inRange(item)) return false;
    if (state.region !== "All" && item.region !== state.region) return false;
    if (state.source && item.source !== state.source) return false;
    if (state.q) {
      var hay = (item.title + " " + item.summary + " " + item.source).toLowerCase();
      var words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) === -1) return false;
    }
    return true;
  }

  function renderTopics() {
    var counts = { All: 0 };
    data.items.forEach(function (it) {
      if (!matchesExceptTopic(it)) return;
      counts.All++;
      it.topics.forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
    });
    var html = "";
    ["All"].concat(data.categories).forEach(function (name) {
      var n = counts[name] || 0;
      if (name !== "All" && n === 0 && state.topic !== name) return;
      html += '<li><button data-topic="' + esc(name) + '" aria-pressed="' + (state.topic === name) + '"><span>' +
        (name === "All" ? "All topics" : esc(name)) + '</span><span class="count">' + n + "</span></button></li>";
    });
    $("topics").innerHTML = html;
  }

  function renderResults() {
    var list = data.items.filter(function (it) {
      return matchesExceptTopic(it) && (state.topic === "All" || it.topics.indexOf(state.topic) !== -1);
    });
    var box = $("results");
    if (!list.length) {
      box.innerHTML = '<div class="status"><strong>Nothing matches these filters</strong>Try a longer time range, a different topic, or clear the search box.</div>';
      return;
    }
    var visible = list.slice(0, state.shown);
    var html = '<p class="result-line">' + list.length + (list.length === 1 ? " story" : " stories") + "</p>";
    var lastDay = "";
    visible.forEach(function (it) {
      var label = dayLabel(it.published);
      if (label !== lastDay) { html += '<h2 class="day">' + esc(label) + "</h2>"; lastDay = label; }
      html += '<article class="item"><h3><a href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a></h3>";
      if (it.summary) html += "<p>" + esc(it.summary) + "</p>";
      html += '<div class="meta"><span class="src">' + esc(it.source) + "</span>" +
        (it.region === "India" ? '<span class="badge-in">India</span>' : "<span>Global</span>") +
        "<span>" + relTime(it.published) + '</span><span class="tags">' +
        it.topics.map(function (t) { return '<button class="tag" data-topic="' + esc(t) + '">' + esc(t) + "</button>"; }).join("") +
        "</span></div></article>";
    });
    if (list.length > visible.length) html += '<button class="more" id="more">Show more stories</button>';
    box.innerHTML = html;
  }

  function render() { renderTopics(); renderResults(); }

  function fillSources() {
    var counts = {};
    data.items.forEach(function (it) { counts[it.source] = (counts[it.source] || 0) + 1; });
    var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
    $("source").innerHTML = '<option value="">All sources</option>' +
      names.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + " (" + counts[n] + ")</option>"; }).join("");
  }

  function setTopic(t) { state.topic = t; state.shown = PAGE; render(); window.scrollTo({ top: 0 }); }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-topic]");
    if (t) { setTopic(t.getAttribute("data-topic")); return; }
    var r = e.target.closest("[data-region]");
    if (r) {
      state.region = r.getAttribute("data-region"); state.shown = PAGE;
      document.querySelectorAll("[data-region]").forEach(function (b) { b.setAttribute("aria-pressed", b === r); });
      render(); return;
    }
    if (e.target.id === "more") { state.shown += PAGE; renderResults(); }
  });
  $("q").addEventListener("input", function (e) { state.q = e.target.value.trim(); state.shown = PAGE; render(); });
  $("source").addEventListener("change", function (e) { state.source = e.target.value; state.shown = PAGE; render(); });
  $("range").addEventListener("change", function (e) { state.days = Number(e.target.value); state.shown = PAGE; render(); });

  fetch("news.json?ts=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (json) {
      data = json;
      if (!data.items || !data.items.length) {
        $("results").innerHTML = '<div class="status"><strong>No stories yet</strong>The first update has not run. In your GitHub repository, open the Actions tab, choose "Update news and publish site", and click Run workflow.</div>';
        return;
      }
      $("updated").innerHTML = "Last updated <strong>" + new Date(data.updated).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) + "</strong><br>" + data.items.length + " stories tracked";
      fillSources();
      render();
    })
    .catch(function () {
      $("results").innerHTML = '<div class="status"><strong>Could not load the news file</strong>If you opened this page by double-clicking the file, that will not work. View it on your GitHub Pages link instead.</div>';
    });
})();
</script>
</body>
</html>
